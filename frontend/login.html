
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QC | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-brand">
            <div class="brand-icon">QC</div>
            <h1>Smart Receiving</h1>
            <p>Quality Control Management System</p>
        </div>

        <form id="loginForm">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to access your workspace</p>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">Sign In</button>

            <p id="errorMessage"></p>
        </form>

        <p class="login-footer">Smart Receiving & Quality Control System</p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
